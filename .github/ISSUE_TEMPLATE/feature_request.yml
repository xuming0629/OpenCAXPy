name: 功能建议
description: 建议新的网格、拓扑、FEM 或后处理能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: 使用场景
      description: 请说明要解决的工程或研究问题。
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 模块
      options:
        - Backend
        - Geometry
        - Mesh
        - Topology
        - Meshing
        - FEM
        - Solver
        - Post/VTK
        - IO
        - CI/CD
        - 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: 建议 API
      description: 可以给出期望的 Python 调用示例。
      render: python
