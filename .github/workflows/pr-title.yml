name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = (
              r"^(feat|fix|docs|test|refactor|perf|build|ci|chore)"
              r"(\([a-z0-9_-]+\))?!?: .+"
          )
          if not re.match(pattern, title):
              print("PR 标题必须符合 Conventional Commits。")
              print("例如：feat(mesh): add Triangle6 refinement")
              sys.exit(1)
          PY
