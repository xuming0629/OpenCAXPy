[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="opencaxpy"
version="1.1.0"
description="General computational engineering and CAX framework"
requires-python=">=3.10"
dependencies=["numpy>=1.24","vtk>=9.3"]

[project.optional-dependencies]
dev=["pytest>=7.0"]

[tool.setuptools.packages.find]
include=["opencaxpy*"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
